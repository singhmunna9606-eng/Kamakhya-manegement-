<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B001C"/>
      <stop offset="100%" stop-color="#40000e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#maroonGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
  
  <!-- Stylized K Crest -->
  <text x="256" y="360" font-family="'Georgia', serif" font-size="280" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="drop-shadow(4px 6px 12px rgba(0,0,0,0.6))">
    K
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="440" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#FFE082" text-anchor="middle" letter-spacing="4">
    KAMAKHYA POS
  </text>
</svg>
