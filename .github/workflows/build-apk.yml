name: Build Android APK (Kamakhya POS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  release:
    types: [ published, created ]

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 6. Build Web Application (Vite)
        run: npm run build

      - name: 7. Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Capacitor Android project..."
            npx cap add android
          fi
          echo "Syncing web assets to Capacitor Android project..."
          npx cap sync android

      - name: 8. Build Android APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Collect and Rename APK
        run: |
          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output-apk/Kamakhya-POS-v1.0.apk
            echo "APK generated successfully at output-apk/Kamakhya-POS-v1.0.apk"
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi
          ls -la output-apk/

      - name: 10. Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: kamakhya-pos-android-apk
          path: output-apk/*.apk
          retention-days: 30

      - name: 11. Attach APK to GitHub Release (If Release Event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
